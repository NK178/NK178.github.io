<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR Sign Language Translator</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>



    <!-- Style to move elsewhere next time  -->
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --border: #dbe3f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        color: var(--muted);
      }

      .btn {
        display: inline-block;
        padding: 12px 20px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Hello, world!</h1>
        <p>This is a quick HTML starter file for your WebAR Sign Language Translator project.</p>
        <button class="btn" type="button">Get Started</button>
      </section>
    </main>



    <!-- Test Camera  -->
    <video id="camera-stream" autoplay playsinline style="width: 100%; max-width: 500px;"></video>

        <script>
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        // Use 'environment' for the back camera, 'user' for the selfie camera
                        facingMode: "environment" 
                    },
                    audio: false // Set to true if you also need the microphone
                };

                // Request user permission for the camera
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Bind the stream to the HTML video element
                const videoElement = document.getElementById('camera-stream');
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Error accessing the camera: ", error);
                alert("Could not access camera. Ensure you are using HTTPS and have given permission.");
            }
        }

        // Start the camera when the page loads
        window.addEventListener('load', startCamera);
    </script>
  </body>
</html>
